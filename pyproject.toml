[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-usage-tracker"
version = "0.1.0"
description = "Local, evidence-aware usage reports for Codex and Claude"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
usage-tracker = "usage_tracker.cli:main"

[tool.setuptools.packages.find]
include = ["usage_tracker*"]

[tool.setuptools.package-data]
usage_tracker = ["static/*", "collectors/*.js"]
